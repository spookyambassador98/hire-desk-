services:
  - type: web
    name: hire-desk
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HIRE_STORAGE
        value: firebase
      - key: HIRE_PARSER_MODE
        value: live
      - key: HIRE_RUN_TARGET
        value: "80"
      - key: HIRE_DAILY_QUOTA
        value: "40"
      - key: SOURCES_REMOTIVE
        value: "1"
      - key: SOURCES_ARBEITNOW
        value: "1"
      - key: SOURCES_REMOTEOK
        value: "1"
      - key: SOURCES_HACKERNEWS
        value: "1"
      - key: SOURCES_GITHUB
        value: "1"
      - key: SOURCES_GREENHOUSE
        value: "1"
      - key: SOURCES_ASHBY
        value: "1"
      - key: SOURCES_LEVER
        value: "1"
      - key: SOURCES_SMARTRECRUITERS
        value: "1"
      - key: SOURCES_WORKABLE
        value: "1"
      - key: SOURCES_HTML
        value: "1"
      - key: SOURCES_TELEGRAM
        value: "0"
      - key: SOURCES_LINKEDIN_IMPORT
        value: "1"
      - key: HIRE_DESK_ACCESS_CODE
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: HARVEST_CRON_SECRET
        sync: false
      - key: HARVEST_INTERNAL_BASE
        sync: false
      - key: PROXY_URLS
        sync: false
      - key: PROXY_GATEWAYS
        value: "1"
      - key: PROXY_GATEWAY_SECRET
        sync: false
      - key: PROXY_BLOCK_CF_WORKER
        value: "0"
      - key: HIRE_RUN_TARGET_NO_PROXY
        value: "35"
      - key: GITHUB_TOKEN
        sync: false

  # Keep free web awake (idle spin-down ~15m; ping every 5m so cron lag can't miss)
  - type: cron
    name: hire-desk-keepalive
    runtime: node
    plan: free
    schedule: "*/5 * * * *"
    buildCommand: echo keepalive
    startCommand: >
      node -e "const u=process.env.KEEPALIVE_URL||'https://hire-desk.onrender.com/api/ping';const hit=async(n)=>{const r=await fetch(u,{cache:'no-store'});const t=await r.text();console.log(n,r.status,t.slice(0,120));if(!r.ok)throw new Error('bad '+r.status)};hit(1).then(()=>new Promise(r=>setTimeout(r,2500))).then(()=>hit(2)).catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: KEEPALIVE_URL
        value: https://hire-desk.onrender.com/api/ping

  - type: cron
    name: hire-desk-harvest-cron
    runtime: node
    plan: free
    schedule: "0 * * * *"
    buildCommand: echo cron
    startCommand: >
      node -e "fetch(process.env.RENDER_CRON_URL,{method:'POST',headers:{Authorization:'Bearer '+process.env.HARVEST_CRON_SECRET}}).then(r=>r.text()).then(console.log).catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: RENDER_CRON_URL
        sync: false
      - key: HARVEST_CRON_SECRET
        sync: false

